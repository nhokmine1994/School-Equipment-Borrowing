<VirtualHost *:80>
    ServerName seb.io.vn
    ServerAlias www.seb.io.vn
    DocumentRoot "C:/xampp/htdocs/SEB"

    <Directory "C:/xampp/htdocs/SEB">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName seb.io.vn
    ServerAlias www.seb.io.vn
    DocumentRoot "C:/xampp/htdocs/SEB"

    <Directory "C:/xampp/htdocs/SEB">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"
</VirtualHost>
